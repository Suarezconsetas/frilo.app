<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Frilo · header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Clarity+City:wght@300;400;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="background: #0F372D; font-family: 'Clarity City', 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #FFFFFF; width: 100%">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; min-height: 80px; flex-wrap: wrap">
<a href="Main.dc.html" aria-label="Frilo, inicio" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none"><img src="/_blob/34387cbc3838c02c4d9ef15a15b5d70e" alt="" style="height: 34px; width: auto; display: block"><img src="/_blob/00d18b0804a41bfd4b8dc73e11787dbc" alt="" style="height: 24px; width: auto; display: block"></a>
<nav aria-label="Principal" style="display: flex; gap: 8px 28px; align-items: center; flex-wrap: wrap">
<sc-for list="{{links}}" as="l" hint-placeholder-count="4">
<a href="{{l.href}}" aria-current="{{l.current}}" style="{{l.estilo}}">{{l.label}}</a>
</sc-for>
</nav>
<div style="display: flex; gap: 12px; align-items: center">
<a href="https://frilo.dev/entrar" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #B5CCC1; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none">Entrar</a>
<a href="https://frilo.dev" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px; border-radius: 16px; background: linear-gradient(100deg, #6FFF8F 0%, #2FB35E 100%); color: #0F372D; font-weight: 700; font-size: 16px; text-decoration: none; box-shadow: 0 0 0 1px rgba(111, 255, 143, 0.35), 0 6px 20px rgba(111, 255, 143, 0.25)">Probar la app gratis<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activo":{"editor":"enum","options":["inicio","calculadoras","dolar","guias","ahorro"],"default":"inicio"},"$preview":{"width":1440,"height":80}}'>
class Component extends DCLogic {
renderVals() {
var activo = this.props.activo || 'inicio';
var base = 'color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; padding: 6px 0; border-bottom: 2px solid transparent';
var on = 'color: #6FFF8F; text-decoration: none; font-size: 15px; font-weight: 700; padding: 6px 0; border-bottom: 2px solid #6FFF8F';
var items = [
{ id: 'calculadoras', label: 'Calculadoras', href: 'CalculadorasHub.dc.html' },
{ id: 'dolar', label: 'Dólar hoy', href: 'DolarHoy.dc.html' },
{ id: 'guias', label: 'Guías', href: 'GuiasHub.dc.html' },
{ id: 'ahorro', label: 'Cuentas que rinden', href: 'CuentasRentables.dc.html' }
];
return {
links: items.map(function (i) {
var cur = i.id === activo;
return { href: i.href, label: i.label, current: cur ? 'page' : 'false', estilo: cur ? on : base };
})
};
}
}
</script>
</body>
</html>
